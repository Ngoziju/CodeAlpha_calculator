<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --cream: #F5EFE3;
    --warm-white: #FAF7F2;
    --amber: #C8893A;
    --amber-light: #E5A94E;
    --amber-dim: #a06c28;
    --rust: #8B3A2A;
    --ink: #1C1410;
    --ink-light: #4A3728;
    --shadow-warm: rgba(30, 18, 8, 0.18);
    --shadow-deep: rgba(30, 18, 8, 0.35);
  }

  html, body {
    height: 100%;
    background: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'DM Mono', monospace;
    cursor: none;
    overflow: hidden;
  }

  /* Custom cursor */
  .cursor {
    position: fixed;
    width: 10px; height: 10px;
    background: var(--amber);
    border-radius: 50%;
    pointer-events: none;
    z-index: 9999;
    transform: translate(-50%, -50%);
    transition: transform 0.1s ease, background 0.2s;
    mix-blend-mode: screen;
  }

  /* Background texture */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse 80% 80% at 20% 30%, rgba(200, 137, 58, 0.06) 0%, transparent 60%),
      radial-gradient(ellipse 60% 60% at 80% 70%, rgba(139, 58, 42, 0.06) 0%, transparent 60%);
    pointer-events: none;
  }

  .wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    animation: rise 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(30px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Label */
  .label {
    font-family: 'Cormorant Garamond', serif;
    font-size: 11px;
    font-weight: 300;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--amber);
    opacity: 0.7;
  }

  /* Body */
  .calc {
    width: 320px;
    background: var(--cream);
    border-radius: 24px;
    padding: 24px 20px 20px;
    box-shadow:
      0 2px 0 rgba(255,255,255,0.04) inset,
      0 40px 80px var(--shadow-deep),
      0 8px 24px var(--shadow-warm);
    position: relative;
    overflow: hidden;
  }

  /* Subtle grain overlay */
  .calc::before {
    content: '';
    position: absolute; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
    background-size: 180px;
    opacity: 0.4;
    pointer-events: none;
    border-radius: 24px;
  }

  /* Display */
  .display {
    background: var(--ink);
    border-radius: 14px;
    padding: 18px 20px 14px;
    margin-bottom: 18px;
    min-height: 96px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
    overflow: hidden;
    box-shadow: inset 0 2px 8px rgba(0,0,0,0.4);
  }

  .display::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(200,137,58,0.3), transparent);
  }

  .expression {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    font-weight: 300;
    color: rgba(200, 137, 58, 0.5);
    text-align: right;
    min-height: 16px;
    letter-spacing: 0.05em;
    transition: opacity 0.2s;
  }

  .result {
    font-family: 'Cormorant Garamond', serif;
    font-size: 48px;
    font-weight: 300;
    color: var(--warm-white);
    text-align: right;
    letter-spacing: -0.01em;
    line-height: 1;
    transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), color 0.2s;
    transform-origin: right center;
  }

  .result.pop {
    transform: scale(1.04);
    color: var(--amber-light);
  }

  /* Grid */
  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 9px;
  }

  /* Buttons */
  .btn {
    height: 62px;
    border: none;
    border-radius: 12px;
    font-family: 'DM Mono', monospace;
    font-size: 15px;
    font-weight: 400;
    cursor: none;
    outline: none;
    position: relative;
    overflow: hidden;
    transition:
    transform 0.1s ease,
     box-shadow 0.15s ease,
     background 0.15s ease;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* Ripple */
  .btn .ripple {
    position: absolute;
    border-radius: 50%;
    transform: scale(0);
    animation: ripple 0.4s linear;
    background: rgba(255,255,255,0.18);
    pointer-events: none;
  }

  @keyframes ripple {
    to { transform: scale(4); opacity: 0; }
  }

  .btn:active {
    transform: scale(0.94);
  }

  /* Digit buttons */
  .btn-digit {
    background: #EDE4D5;
    color: var(--ink);
    box-shadow: 0 3px 0 #C8BA9E, 0 4px 8px rgba(0,0,0,0.1);
  }
  .btn-digit:hover {
    background: #F0E8DA;
    box-shadow: 0 4px 0 #C8BA9E, 0 6px 12px rgba(0,0,0,0.12);
    transform: translateY(-1px);
  }
  .btn-digit:active {
    transform: translateY(2px) scale(0.96);
    box-shadow: 0 1px 0 #C8BA9E;
  }

  /* Zero wide */
  .btn-zero {
    grid-column: span 2;
    text-align: left;
    padding-left: 22px;
    font-size: 16px;
  }
  

  /* Operator buttons */
  .btn-op {
    background: var(--amber);
    color: var(--warm-white);
    box-shadow: 0 3px 0 var(--amber-dim), 0 4px 12px rgba(200,137,58,0.3);
    font-size: 18px;
  }
  .btn-op:hover {
    background: var(--amber-light);
    box-shadow: 0 4px 0 var(--amber-dim), 0 8px 18px rgba(200,137,58,0.4);
    transform: translateY(-1px);
  }
  .btn-op:active {
    transform: translateY(2px) scale(0.96);
    box-shadow: 0 1px 0 var(--amber-dim);
  }

  /* Equals */
  .btn-eq {
    background: var(--rust);
    color: var(--warm-white);
    box-shadow: 0 3px 0 #5E2519, 0 4px 12px rgba(139,58,42,0.3);
    font-size: 20px;
  }
  .btn-eq:hover {
    background: #A04535;
    box-shadow: 0 4px 0 #5E2519, 0 8px 18px rgba(139,58,42,0.4);
    transform: translateY(-1px);
  }
  .btn-eq:active {
    transform: translateY(2px) scale(0.96);
    box-shadow: 0 1px 0 #5E2519;
  }

  /* Function buttons (AC, +/-, %) */
  .btn-fn {
    background: #D5C9B8;
    color: var(--ink-light);
    box-shadow: 0 3px 0 #B5A898, 0 4px 8px rgba(0,0,0,0.08);
    font-size: 13px;
    letter-spacing: 0.02em;
  }
  .btn-fn:hover {
    background: #DDD3C3;
    box-shadow: 0 4px 0 #B5A898, 0 6px 12px rgba(0,0,0,0.1);
    transform: translateY(-1px);
  }
  .btn-fn:active {
    transform: translateY(2px) scale(0.96);
    box-shadow: 0 1px 0 #B5A898;
  }

  /* Active op highlight */
  .btn-op.active-op {
    background: var(--warm-white);
    color: var(--amber);
  }

  /* Decorative serif numeral label */
  .serif-label {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 10px;
    letter-spacing: 0.2em;
    color: var(--ink-light);
    opacity: 0.4;
    text-align: center;
    margin-top: 14px;
  }
</style>
</head>
<body>

<div class="cursor" id="cursor"></div>

<div class="wrapper">
  <span class="label">Calculator</span>

  <div class="calc">
    <div class="display">
      <div class="expression" id="expression"></div>
      <div class="result" id="result">0</div>
    </div>

    <div class="grid">
      <!-- Row 1 -->
      <button class="btn btn-fn" data-action="clear">AC</button>
      <button class="btn btn-fn" data-action="sign">+/−</button>
      <button class="btn btn-fn" data-action="percent">%</button>
      <button class="btn btn-op" data-action="op" data-op="÷">÷</button>

      <!-- Row 2 -->
      <button class="btn btn-digit" data-action="digit" data-val="7">7</button>
      <button class="btn btn-digit" data-action="digit" data-val="8">8</button>
      <button class="btn btn-digit" data-action="digit" data-val="9">9</button>
      <button class="btn btn-op" data-action="op" data-op="×">×</button>

      <!-- Row 3 -->
      <button class="btn btn-digit" data-action="digit" data-val="4">4</button>
      <button class="btn btn-digit" data-action="digit" data-val="5">5</button>
      <button class="btn btn-digit" data-action="digit" data-val="6">6</button>
      <button class="btn btn-op" data-action="op" data-op="−">−</button>

      <!-- Row 4 -->
      <button class="btn btn-digit" data-action="digit" data-val="1">1</button>
      <button class="btn btn-digit" data-action="digit" data-val="2">2</button>
      <button class="btn btn-digit" data-action="digit" data-val="3">3</button>
      <button class="btn btn-op" data-action="op" data-op="+">+</button>

      <!-- Row 5 -->
      <button class="btn btn-digit btn-zero" data-action="digit" data-val="0">0</button>
      <button class="btn btn-digit" data-action="decimal">.</button>
      <button class="btn btn-eq" data-action="equals">=</button>
    </div>

    <p class="serif-label">made for you</p>
  </div>
</div>

<script>
  // Custom cursor
  const cursor = document.getElementById('cursor');
  document.addEventListener('mousemove', e => {
    cursor.style.left = e.clientX + 'px';
    cursor.style.top  = e.clientY + 'px';
  });

  // --- Calculator State ---
  let current   = '0';
  let previous  = null;
  let operator  = null;
  let justEvaled = false;
  let clearNext  = false;

  const exprEl   = document.getElementById('expression');
  const resultEl = document.getElementById('result');

  function formatNum(n) {
    const s = parseFloat(n.toPrecision(10)).toString();
    const [int, dec] = s.split('.');
    const formatted = Number(int).toLocaleString('en-US');
    return dec ? formatted + '.' + dec : formatted;
  }

  function render(pop = false) {
    let display = current === 'Error' ? 'Error' : formatNum(parseFloat(current));
    resultEl.textContent = display;
    if (pop) {
      resultEl.classList.add('pop');
      setTimeout(() => resultEl.classList.remove('pop'), 200);
    }
  }

  function setActiveOp(op) {
    document.querySelectorAll('.btn-op').forEach(b => b.classList.remove('active-op'));
    if (op) {
      document.querySelectorAll('.btn-op').forEach(b => {
        if (b.dataset.op === op) b.classList.add('active-op');
      });
    }
  }

  function compute() {
    const a = parseFloat(previous);
    const b = parseFloat(current);
    if (isNaN(a) || isNaN(b)) return;
    let result;
    switch (operator) {
      case '+': result = a + b; break;
      case '−': result = a - b; break;
      case '×': result = a * b; break;
      case '÷': result = b === 0 ? 'Error' : a / b; break;
      default: return;
    }
    exprEl.textContent = formatNum(a) + ' ' + operator + ' ' + formatNum(b);
    current    = result === 'Error' ? 'Error' : String(result);
    previous   = null;
    operator   = null;
    justEvaled = true;
    setActiveOp(null);
    render(true);
  }

  function handleAction(action, val, op) {
    switch (action) {
      case 'digit':
        if (current === 'Error') { current = val; render(); return; }
        if (justEvaled || clearNext) { current = val; justEvaled = false; clearNext = false; }
        else current = current === '0' ? val : current + val;
        if (current.length > 12) return;
        render();
        break;

      case 'decimal':
        if (current === 'Error') { current = '0.'; render(); return; }
        if (justEvaled || clearNext) { current = '0.'; justEvaled = false; clearNext = false; render(); return; }
        if (!current.includes('.')) { current += '.'; render(); }
        break;

      case 'op':
        if (current === 'Error') return;
        if (previous !== null && !justEvaled && !clearNext) compute();
        previous  = current;
        operator  = op;
        clearNext = true;
        justEvaled = false;
        exprEl.textContent = formatNum(parseFloat(previous)) + ' ' + operator;
        setActiveOp(op);
        break;

      case 'equals':
        if (operator && previous !== null) {
          compute();
        }
        break;

      case 'clear':
        current = '0'; previous = null; operator = null;
        justEvaled = false; clearNext = false;
        exprEl.textContent = '';
        setActiveOp(null);
        render();
        break;

      case 'sign':
        if (current === 'Error' || current === '0') return;
        current = String(parseFloat(current) * -1);
        render();
        break;

      case 'percent':
        if (current === 'Error') return;
        current = String(parseFloat(current) / 100);
        render();
        break;
    }
  }

  // Button clicks + ripple
  document.querySelectorAll('.btn').forEach(btn => {
    btn.addEventListener('click', e => {
      // Ripple
      const r = document.createElement('span');
      r.className = 'ripple';
      const rect = btn.getBoundingClientRect();
      const size = Math.max(rect.width, rect.height) * 1.5;
      r.style.cssText = `width:${size}px;height:${size}px;left:${e.clientX - rect.left - size/2}px;top:${e.clientY - rect.top - size/2}px`;
      btn.appendChild(r);
      setTimeout(() => r.remove(), 500);

      const { action, val, op } = btn.dataset;
      handleAction(action, val, op);
    });
  });

  // Keyboard support
  document.addEventListener('keydown', e => {
    const key = e.key;
    if (/^[0-9]$/.test(key)) handleAction('digit', key);
    else if (key === '.')  handleAction('decimal');
    else if (key === '+')  handleAction('op', null, '+');
    else if (key === '-')  handleAction('op', null, '−');
    else if (key === '*')  handleAction('op', null, '×');
    else if (key === '/')  { e.preventDefault(); handleAction('op', null, '÷'); }
    else if (key === 'Enter' || key === '=') handleAction('equals');
    else if (key === 'Escape') handleAction('clear');
    else if (key === 'Backspace') {
      if (current.length > 1 && current !== 'Error') {
        current = current.slice(0, -1) || '0';
        render();
      } else {
        current = '0'; render();
      }
    }
    else if (key === '%') handleAction('percent');
  });
</script>
</body>
</html>
